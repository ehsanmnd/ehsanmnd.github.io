<!-- begin c-hero -->
<div class="hero">
  <div class="container">
    <div class="row">
      <div class="col col-6 col-t-12 last-item">
        <div class="hero__content">
          <h1 class="hero__title">
            {{ site.data.fa.hero.greeting }}
          </h1>
          <p class="hero__subtitle" style="text-align: justify;">
            {{ site.data.fa.hero.intro }}
            <a href="{{ site.baseurl }}/about/fa">{{ site.data.fa.hero.cta_text }}</a>
            رو بخونید.
          </p>
          <div class="hero__social">
            <span class="hero__social-title">{{ site.data.fa.hero.social_title }}</span>
            {% include contact-link.html %}
          </div>
        </div>
      </div>
      <div class="col col-6 col-t-12">
        <div class="hero__image">
          <img src="{{site.baseurl}}/assets/images/{{ site.data.settings.author.image }}" alt="{{ site.data.settings.author.name }}">
        </div>
      </div>
    </div>
  </div>
</div>
<!-- end hero -->
