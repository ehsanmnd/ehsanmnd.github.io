{% if page.lang == "en" %}
  {% assign t = site.data.en %}
{% else %}
  {% assign t = site.data.fa %}
{% endif %}

<script defer src="{{ site.baseurl }}/assets/js/vendors/jquery-3.3.1.min.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/vendors/simple-jekyll-search.min.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/vendors/transition.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/vendors/zoom.min.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/vendors/jquery.fitvids.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/common.js"></script>
<script defer src="{{ site.baseurl }}/assets/js/persian-digits.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    SimpleJekyllSearch({
      searchInput: document.getElementById("js-search-input"),
      resultsContainer: document.getElementById("js-results-container"),
      json: "{{site.baseurl}}/search.json",
      searchResultTemplate: '<li class="search-results__item"><a class="search-results__link" href="{url}">{title}</a><br> <span class="search-results__date">{date}</span></li>',
      noResultsText: '<li class="no-results">{{ t.search.no_results }}</li>'
    });
  });
</script>
